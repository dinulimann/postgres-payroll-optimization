services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
      POSTGRES_DB: payroll
    ports:
      - "5544:5432"
    volumes:
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll"]
      interval: 2s
      timeout: 3s
      retries: 30
